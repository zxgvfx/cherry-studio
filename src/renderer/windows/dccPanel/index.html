<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <meta name="logger-window-source" content="DccPanel" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src blob: *; script-src 'self' 'unsafe-eval' *; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' *; font-src 'self' data: *; img-src 'self' data: file: * blob:; frame-src * file:" />
    <title>Cherry Agent</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #1a1a1a;
        color: #e5e5e5;
      }

      #spinner {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #1a1a1a;
        color: #a3a3a3;
        font: 13px/1.4 system-ui, sans-serif;
        z-index: 9999;
      }

      #spinner::before {
        content: '';
        width: 28px;
        height: 28px;
        border: 2px solid #3f3f46;
        border-top-color: #e5e5e5;
        border-radius: 50%;
        animation: dcc-spin 0.8s linear infinite;
      }

      @keyframes dcc-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="spinner">正在启动 Cherry Agent…</div>
    <script type="module" src="/windows/dccPanel/entryPoint.tsx"></script>
  </body>
</html>
